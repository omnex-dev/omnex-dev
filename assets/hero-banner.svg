<svg width="920" height="340" viewBox="0 0 920 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>

    <!-- Neon Laser Accent -->
    <linearGradient id="laserGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="340" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="920" height="340" rx="20" fill="url(#grid)"/>

  <!-- Ambient Ambient Glows -->
  <circle cx="120" cy="80" r="140" fill="#00F5A0" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="800" cy="240" r="160" fill="#00D9F5" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Accent Laser Line -->
  <path d="M 20 1 L 900 1" stroke="url(#laserGradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="918" height="338" rx="19" stroke="#1E293B" stroke-width="1.2" fill="none"/>

  <!-- Top Status Bar -->
  <g transform="translate(48, 48)">
    <!-- Status Indicator Dot -->
    <circle cx="6" cy="6" r="4.5" fill="#00F5A0"/>
    <circle cx="6" cy="6" r="8" fill="#00F5A0" fill-opacity="0.25"/>
    
    <text x="24" y="10" fill="#00F5A0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="600" letter-spacing="1.5">SYSTEM ACTIVE // CREATIVE ARCHITECT</text>
    <text x="824" y="10" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" letter-spacing="1">DHAKA, BD [UTC+6]</text>
  </g>

  <!-- Main Hero Title -->
  <text x="48" y="132" fill="url(#titleGradient)" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">OMNEX <tspan fill="#64748B" font-weight="400" font-size="34">/ Arnob</tspan></text>

  <!-- Subtitle / Tagline -->
  <text x="48" y="174" fill="#94A3B8" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
    Creative Technologist &amp; Full-Stack Systems Architect
  </text>
  <text x="48" y="202" fill="#64748B" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-style="italic">
    "Designing at the intersection of fluid, high-frame-rate frontend engineering and resilient backend systems."
  </text>

  <!-- Bottom Metric Pills -->
  <g transform="translate(48, 246)">
    <!-- Pill 1: 2,000+ Contributions -->
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="21" r="4" fill="#00F5A0"/>
    <text x="34" y="26" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">2,000+ Annual Commits</text>

    <!-- Pill 2: 120 FPS UI -->
    <rect x="236" y="0" width="240" height="42" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    <circle cx="256" cy="21" r="4" fill="#00D9F5"/>
    <text x="270" y="26" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">60–120 FPS Motion Physics</text>

    <!-- Pill 3: Distributed Systems -->
    <rect x="492" y="0" width="250" height="42" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    <circle cx="512" cy="21" r="4" fill="#A855F7"/>
    <text x="526" y="26" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Distributed &amp; Cloud Systems</text>
  </g>
</svg>
